[project]
name = "qdrant-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agno",
    "openai",
    "anthropic",
    "tavily-python",
    "python-dotenv",
]

[project.scripts]
qdrant-agent = "qdrant_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_agent"]
